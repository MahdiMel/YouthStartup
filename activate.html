<!DOCTYPE html>
<html>
<head>
    <title>Activate Badge</title>
    <!-- Load Supabase from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
    <h2>Activate Your Smart Badge</h2>
    <input type="email" id="emailInput" placeholder="Enter your registered email" style="padding: 10px; width: 250px;">
    <button onclick="activateUser()" style="padding: 10px;">Activate</button>
    <p id="status"></p>

    <script>
        // REPLACE WITH YOUR SUPABASE URL AND ANON KEY
        const supabaseUrl = 'https://bgykmhfbrvqsvxfdiilt.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJneWttaGZicnZxc3Z4ZmRpaWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjUwNjQsImV4cCI6MjEwMTI0MTA2NH0.4RZftqNNAPwrvBwL8jj1-XK0k5LgPeFphnm28Myd_94';
        const supabaseDb = window.supabase.createClient(supabaseUrl, supabaseKey, {
            db: {
                schema: 'youth_startup'
            }  
        });
        async function activateUser() {
            const email = document.getElementById('emailInput').value;
            const statusMsg = document.getElementById('status');
            statusMsg.innerText = "Checking...";

            // Find the user by email
            const { data, error } = await supabaseDb
                .from('attendees')
                .select('id')
                .eq('email', email)
                .single();

            if (error || !data) {
                statusMsg.innerText = "Email not found. Please check for typos.";
                return;
            }

            // Save the ID to the phone's local storage
            localStorage.setItem('scanner_id', data.id);
            statusMsg.style.color = "green";
            statusMsg.innerText = "Badge Activated! You can now scan other participants.";
        }
    </script>
</body>
</html>
