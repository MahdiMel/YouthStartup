<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Badge | Youth Startups</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .logo { width: 150px; margin-bottom: 20px; }
        h2 { color: #051024; margin-top: 0; font-size: 1.5rem; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 20px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #0082c8; }
        button {
            width: 100%;
            background-color: #0082c8;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #006bb3; }
        #status { margin-top: 20px; font-size: 0.9rem; font-weight: 600; height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="C:\Users\mehdi\OneDrive\Desktop\Youth Startup\QRcode\images\logo JCI.png" alt="JCI Monastir" class="logo">
        <h2>Activate Badge</h2>
        <p>Enter your registration email to link this device to your smart badge.</p>
        <input type="email" id="emailInput" placeholder="name@example.com">
        <button id="activateBtn" onclick="activateUser()">Activate Device</button>
        <div id="status"></div>
    </div>

    <script>
        const supabaseUrl = 'https://bgykmhfbrvqsvxfdiilt.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJneWttaGZicnZxc3Z4ZmRpaWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjUwNjQsImV4cCI6MjEwMTI0MTA2NH0.4RZftqNNAPwrvBwL8jj1-XK0k5LgPeFphnm28Myd_94';
        const supabaseDb = window.supabase.createClient(supabaseUrl, supabaseKey, {
            db: { schema: 'youth_startup' }
        });

        async function activateUser() {
            const email = document.getElementById('emailInput').value;
            const statusMsg = document.getElementById('status');
            const btn = document.getElementById('activateBtn');
            
            if(!email) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "Please enter an email.";
                return;
            }

            btn.innerText = "Checking...";
            btn.style.opacity = "0.7";

            const { data: userId, error } = await supabaseDb.rpc('activate_device', { 
                p_email: email 
            });

            if (error || !userId) {
                btn.innerText = "Activate Device";
                btn.style.opacity = "1";
                statusMsg.style.color = "red";
                statusMsg.innerText = "Email not found.";
                return;
            }

            localStorage.setItem('scanner_id', userId);
            btn.style.backgroundColor = "#10b981"; 
            btn.innerText = "Activated!";
            statusMsg.style.color = "#10b981";
            statusMsg.innerText = "Ready to scan.";
        }
    </script>
</body>
</html>
