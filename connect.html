<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s ease;
        }
        .spinner {
            width: 120px;
            height: 120px;
            background-image: url("images\\background2.jpeg");
            background-size: cover;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .success-icon {
            display: none;
            font-size: 80px;
            color: white;
            margin-bottom: 20px;
        }
        h2 { font-size: 1.5rem; letter-spacing: 1px; }
        .logo-footer { width: 100px; position: absolute; bottom: 30px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="ios-warning" style="display: none; background-color: #e67e22; color: white; text-align: center; padding: 12px; font-weight: bold; position: sticky; top: 0; z-index: 1000; width: 100%; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);">
    ⚠️ Utilisateurs iPhone : Pour que vos connexions soient sauvegardées, scannez les badges avec votre application <b>Appareil Photo standard</b>, et non avec le scanner de code QR du centre de contrôle.
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="success-icon" id="successIcon">✓</div>
    <h2 id="statusMessage">Connecting...</h2>
    
    <img src="images\logo jci noir.jpeg" class="logo-footer">

    <script>
        const supabaseUrl = 'https://bgykmhfbrvqsvxfdiilt.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJneWttaGZicnZxc3Z4ZmRpaWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjUwNjQsImV4cCI6MjEwMTI0MTA2NH0.4RZftqNNAPwrvBwL8jj1-XK0k5LgPeFphnm28Myd_94';
        const supabaseDb = window.supabase.createClient(supabaseUrl, supabaseKey, {
            db: { schema: 'youth_startup' }
        });

        async function processScan() {
            const scannerId = localStorage.getItem('scanner_id');
            if (!scannerId) { window.location.replace('index.html'); return; }

            const urlParams = new URLSearchParams(window.location.search);
            const scannedId = urlParams.get('scanned');
            const statusMsg = document.getElementById('statusMessage');

            if (!scannedId) { statusMsg.innerText = "Invalid Badge"; return; }

            const { data: redirectUrl, error } = await supabaseDb.rpc('record_scan', { 
                p_scanner: scannerId, 
                p_scanned: scannedId 
            });

            if (error) {
                statusMsg.innerText = "Error saving connection.";
                return;
            }

            document.body.style.backgroundColor = "#10b981"; 
            document.getElementById('spinner').style.display = "none";
            document.getElementById('successIcon').style.display = "block";
            statusMsg.innerText = "Connection Saved!";
            
            setTimeout(() => {
                if (redirectUrl) {
                    window.location.replace(redirectUrl);
                } else {
                    statusMsg.innerText = "No LinkedIn URL found.";
                }
            }, 1200); 
        }
    document.addEventListener("DOMContentLoaded", function() {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
        if (isIOS) {
            document.getElementById('ios-warning').style.display = 'block';
        }
    });

        processScan();

    </script>
</body>
</html>
